<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2B48"/>
      <stop offset="100%" stop-color="#061A2F"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="shadowBox" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284C7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Industrial Plant Isometric Container -->
  <rect x="25" y="25" width="550" height="400" rx="24" fill="url(#bgGrad)" stroke="#1E4064" stroke-width="2" filter="url(#shadowBox)"/>
  
  <!-- Flow Grid Lines -->
  <g opacity="0.15" stroke="#38BDF8" stroke-width="1">
    <line x1="25" y1="100" x2="575" y2="100"/>
    <line x1="25" y1="180" x2="575" y2="180"/>
    <line x1="25" y1="260" x2="575" y2="260"/>
    <line x1="25" y1="340" x2="575" y2="340"/>
    <line x1="120" y1="25" x2="120" y2="425"/>
    <line x1="240" y1="25" x2="240" y2="425"/>
    <line x1="360" y1="25" x2="360" y2="425"/>
    <line x1="480" y1="25" x2="480" y2="425"/>
  </g>

  <!-- Treatment Stage 1: Pre-treatment / Sand Filter Cylinder -->
  <g transform="translate(80, 140)">
    <rect x="0" y="30" width="80" height="150" rx="12" fill="#13385E" stroke="#38BDF8" stroke-width="2"/>
    <ellipse cx="40" cy="30" rx="40" ry="16" fill="#1E4A78" stroke="#38BDF8" stroke-width="2"/>
    <ellipse cx="40" cy="180" rx="40" ry="16" fill="#0A223A" stroke="#38BDF8" stroke-width="2"/>
    <!-- Multi-port Valve on Top -->
    <rect x="28" y="0" width="24" height="30" rx="4" fill="#0284C7"/>
    <circle cx="40" cy="8" r="7" fill="#38BDF8"/>
    <!-- Pressure Gauge -->
    <circle cx="40" cy="80" r="16" fill="#061729" stroke="#38BDF8" stroke-width="2"/>
    <line x1="40" y1="80" x2="48" y2="74" stroke="#00C49F" stroke-width="2"/>
    <text x="40" y="140" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">SAND/CARBON</text>
  </g>

  <!-- Connecting Pipe 1 -->
  <path d="M 160 210 L 220 210" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="190" cy="210" r="5" fill="#38BDF8"/>

  <!-- Treatment Stage 2: Reverse Osmosis Membrane Skids -->
  <g transform="translate(220, 110)">
    <!-- Skid Frame -->
    <rect x="0" y="20" width="160" height="200" rx="16" fill="rgba(10,37,64,0.6)" stroke="#0D9488" stroke-width="2"/>
    <!-- Membrane Pressure Vessels (3 horizontal cylinders) -->
    <rect x="15" y="45" width="130" height="28" rx="8" fill="#1A4A75" stroke="#38BDF8" stroke-width="2"/>
    <rect x="15" y="95" width="130" height="28" rx="8" fill="#1A4A75" stroke="#38BDF8" stroke-width="2"/>
    <rect x="15" y="145" width="130" height="28" rx="8" fill="#1A4A75" stroke="#38BDF8" stroke-width="2"/>
    <!-- Flow Direction Arrows -->
    <path d="M 30 59 L 50 59 M 45 54 L 52 59 L 45 64" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 30 109 L 50 109 M 45 104 L 52 109 L 45 114" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 30 159 L 50 159 M 45 154 L 52 159 L 45 164" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <!-- High Pressure Pump Icon -->
    <circle cx="15" cy="190" r="14" fill="#0D9488"/>
    <text x="80" y="205" text-anchor="middle" fill="#5EEAD4" font-family="sans-serif" font-size="11" font-weight="700">RO MEMBRANE SKID</text>
  </g>

  <!-- Connecting Pipe 2 -->
  <path d="M 380 180 L 430 180" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round"/>

  <!-- Treatment Stage 3: Pure Water Buffer & Online Monitoring -->
  <g transform="translate(430, 120)">
    <!-- Water Tank -->
    <rect x="10" y="30" width="90" height="170" rx="14" fill="#0D3356" stroke="#00C49F" stroke-width="2"/>
    <ellipse cx="55" cy="30" rx="45" ry="18" fill="#1A4E7A" stroke="#00C49F" stroke-width="2"/>
    <!-- Water Level Indicator -->
    <path d="M 20 120 C 35 115 45 125 55 120 C 65 115 80 125 90 120 L 90 185 C 90 193 80 198 55 198 C 30 198 20 193 20 185 Z" fill="rgba(0,196,159,0.3)"/>
    <!-- Flow Transmitter Display Box -->
    <rect x="25" y="60" width="60" height="40" rx="6" fill="#061729" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="55" y="78" text-anchor="middle" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="700">pH 7.2</text>
    <text x="55" y="92" text-anchor="middle" fill="#00C49F" font-family="monospace" font-size="10" font-weight="700">TDS 28</text>
    <text x="55" y="222" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">DISCHARGE/REUSE</text>
  </g>

  <!-- Process Telemetry / Status Pill -->
  <g transform="translate(190, 50)">
    <rect x="0" y="0" width="220" height="36" rx="18" fill="rgba(2,132,199,0.2)" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="6" fill="#10B981"/>
    <text x="35" y="23" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">SYSTEM STATUS: OPTIMAL</text>
  </g>
</svg>
