<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C49F" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0F4C81" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284C7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(10, 10)">
    <!-- Water Drop Outer Aura / Wave Ring -->
    <circle cx="40" cy="40" r="38" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.6"/>
    
    <!-- Central Drop with Chemistry Ring -->
    <path d="M 40 8 C 40 8 18 36 18 52 C 18 64.15 27.85 74 40 74 C 52.15 74 62 64.15 62 52 C 62 36 40 8 40 8 Z" 
          fill="url(#dropGrad)" filter="url(#glow)"/>
    
    <!-- Chemistry Molecule Node Accents inside Drop -->
    <circle cx="34" cy="46" r="3.5" fill="#FFFFFF" opacity="0.95" />
    <circle cx="48" cy="42" r="2.5" fill="#A5F3FC" opacity="0.95" />
    <circle cx="38" cy="58" r="3" fill="#E0F2FE" opacity="0.95" />
    <line x1="34" y1="46" x2="48" y2="42" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8" />
    <line x1="34" y1="46" x2="38" y2="58" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8" />
    
    <!-- Water Ripple Reflection -->
    <path d="M 28 38 C 24 45 25 54 28 58" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6" fill="none"/>
  </g>

  <!-- Typography -->
  <g transform="translate(105, 22)">
    <!-- Brand Name -->
    <text x="0" y="32" font-family="'Outfit', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#0A2540" letter-spacing="1.2">
      CHEMSOLV
    </text>
    <text x="175" y="32" font-family="'Outfit', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#0284C7" letter-spacing="1">
      ASSOCIATES
    </text>
    
    <!-- Tagline / Descriptor -->
    <text x="2" y="52" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#0D9488" letter-spacing="2.8">
      WATER &amp; WASTEWATER TREATMENT SOLUTIONS
    </text>
  </g>
</svg>
